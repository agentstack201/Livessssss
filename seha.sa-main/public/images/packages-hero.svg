<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900"
     role="img" aria-label="محفظة رقمية وبطاقات ورصيد صحي">
  <title>الباقات والأرصدة</title>
  <defs>
    <!-- ── خلفية ووهج ─────────────────────────────────────────────────── -->
    <linearGradient id="pkSky" x1="1" y1="0" x2="0.05" y2="1">
      <stop offset="0" stop-color="#f8fcff"/>
      <stop offset="0.42" stop-color="#e9f4fe"/>
      <stop offset="1" stop-color="#daeefb"/>
    </linearGradient>
    <radialGradient id="pkGlowCyan"><stop offset="0" stop-color="#7fdcff" stop-opacity="0.5"/><stop offset="1" stop-color="#7fdcff" stop-opacity="0"/></radialGradient>
    <radialGradient id="pkGlowBlue"><stop offset="0" stop-color="#6ba0f7" stop-opacity="0.38"/><stop offset="1" stop-color="#6ba0f7" stop-opacity="0"/></radialGradient>
    <radialGradient id="pkGlowTeal"><stop offset="0" stop-color="#41d6c8" stop-opacity="0.34"/><stop offset="1" stop-color="#41d6c8" stop-opacity="0"/></radialGradient>
    <linearGradient id="pkCity" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5d92cd"/>
      <stop offset="0.62" stop-color="#7fb0da" stop-opacity="0.72"/>
      <stop offset="1" stop-color="#a9d2e6" stop-opacity="0.25"/>
    </linearGradient>
    <radialGradient id="pkGround"><stop offset="0" stop-color="#123a86" stop-opacity="0.26"/><stop offset="0.62" stop-color="#123a86" stop-opacity="0.07"/><stop offset="1" stop-color="#123a86" stop-opacity="0"/></radialGradient>

    <!-- ── موجات ──────────────────────────────────────────────────────── -->
    <linearGradient id="pkWaveA" x1="0" y1="0" x2="1" y2="0.3">
      <stop offset="0" stop-color="#0fb5a6" stop-opacity="0.5"/>
      <stop offset="0.5" stop-color="#2ba6dd" stop-opacity="0.4"/>
      <stop offset="1" stop-color="#5b93f5" stop-opacity="0.18"/>
    </linearGradient>
    <linearGradient id="pkWaveB" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#e2f1ff" stop-opacity="0.6"/>
    </linearGradient>
    <linearGradient id="pkWaveC" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#9aeae4" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#c8e6ff" stop-opacity="0.12"/>
    </linearGradient>

    <!-- ── زجاج ───────────────────────────────────────────────────────── -->
    <linearGradient id="pkGlass" x1="0.1" y1="0" x2="0.8" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.42"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.1"/>
    </linearGradient>
    <linearGradient id="pkGlassEdge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="0.55" stop-color="#ffffff" stop-opacity="0.2"/>
      <stop offset="1" stop-color="#c6e2ff" stop-opacity="0.75"/>
    </linearGradient>

    <!-- ── المحفظة ────────────────────────────────────────────────────── -->
    <linearGradient id="pkWalletBack" x1="0" y1="0" x2="0.5" y2="1">
      <stop offset="0" stop-color="#4d86e6"/>
      <stop offset="1" stop-color="#2450ad"/>
    </linearGradient>
    <linearGradient id="pkWalletFront" x1="0.05" y1="0" x2="0.95" y2="1">
      <stop offset="0" stop-color="#2358c4"/>
      <stop offset="0.45" stop-color="#153c8d"/>
      <stop offset="1" stop-color="#0b2158"/>
    </linearGradient>
    <linearGradient id="pkLip" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8ec4ff" stop-opacity="0.2"/>
      <stop offset="0.45" stop-color="#d3ecff" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#8ec4ff" stop-opacity="0.2"/>
    </linearGradient>
    <linearGradient id="pkClasp" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#b5e6ff"/>
      <stop offset="0.5" stop-color="#4fb0ec"/>
      <stop offset="1" stop-color="#1a72c2"/>
    </linearGradient>
    <linearGradient id="pkPocketSheen" x1="0" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.22"/>
      <stop offset="0.55" stop-color="#ffffff" stop-opacity="0.02"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.12"/>
    </linearGradient>

    <!-- ── البطاقات ───────────────────────────────────────────────────── -->
    <linearGradient id="pkCardCyan" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7ff0fb"/>
      <stop offset="0.5" stop-color="#2ec0e0"/>
      <stop offset="1" stop-color="#0d90b4"/>
    </linearGradient>
    <linearGradient id="pkCardWhite" x1="0.1" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#dcecfd"/>
    </linearGradient>
    <linearGradient id="pkCardBlue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5e9bf6"/>
      <stop offset="0.48" stop-color="#2358c9"/>
      <stop offset="1" stop-color="#122c74"/>
    </linearGradient>
    <linearGradient id="pkSheen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="0.42" stop-color="#ffffff" stop-opacity="0.42"/>
      <stop offset="0.56" stop-color="#ffffff" stop-opacity="0.04"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>

    <!-- ── عملات الرصيد ───────────────────────────────────────────────── -->
    <linearGradient id="pkCoinFace" x1="0.15" y1="0" x2="0.85" y2="1">
      <stop offset="0" stop-color="#e2f6ff"/>
      <stop offset="0.4" stop-color="#79cbf9"/>
      <stop offset="1" stop-color="#1e6fd6"/>
    </linearGradient>
    <linearGradient id="pkCoinEdge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a91e2"/>
      <stop offset="1" stop-color="#12468f"/>
    </linearGradient>

    <!-- ── الدرع والقلب ───────────────────────────────────────────────── -->
    <linearGradient id="pkShield" x1="0.05" y1="0" x2="0.95" y2="1">
      <stop offset="0" stop-color="#8ecbff"/>
      <stop offset="0.45" stop-color="#3277e6"/>
      <stop offset="1" stop-color="#12379a"/>
    </linearGradient>
    <linearGradient id="pkHeart" x1="0.2" y1="0" x2="0.8" y2="1">
      <stop offset="0" stop-color="#a8dbff"/>
      <stop offset="0.5" stop-color="#4f9aef"/>
      <stop offset="1" stop-color="#1d51b8"/>
    </linearGradient>

    <!-- ── مرشّحات ────────────────────────────────────────────────────── -->
    <filter id="pkSoft" x="-45%" y="-45%" width="190%" height="190%">
      <feDropShadow dx="0" dy="30" stdDeviation="30" flood-color="#0b2a63" flood-opacity="0.26"/>
    </filter>
    <filter id="pkSoftSm" x="-70%" y="-70%" width="240%" height="240%">
      <feDropShadow dx="0" dy="14" stdDeviation="14" flood-color="#0b2a63" flood-opacity="0.26"/>
    </filter>
    <filter id="pkCardShadow" x="-45%" y="-45%" width="190%" height="190%">
      <feDropShadow dx="0" dy="16" stdDeviation="16" flood-color="#0b2a63" flood-opacity="0.2"/>
    </filter>

    <clipPath id="pkFrame"><rect width="1600" height="900"/></clipPath>
  </defs>

  <g clip-path="url(#pkFrame)">
    <!-- ══ الخلفية ═══════════════════════════════════════════════════════ -->
    <rect width="1600" height="900" fill="url(#pkSky)"/>
    <ellipse cx="380" cy="230" rx="520" ry="420" fill="url(#pkGlowCyan)"/>
    <ellipse cx="1180" cy="300" rx="500" ry="420" fill="url(#pkGlowBlue)"/>
    <ellipse cx="700" cy="720" rx="640" ry="300" fill="url(#pkGlowTeal)"/>

    <!-- ══ أفق الرياض المجرّد ════════════════════════════════════════════ -->
    <g opacity="0.34" fill="url(#pkCity)">
      <!-- برج المملكة: جسم بفتحة قوسية أعلاه -->
      <path fill-rule="evenodd"
            d="M172 706V232q0-58 44-84l42-25 42 25q44 26 44 84v474Z
               M224 392V282q34-42 68 0v110Z"/>
      <!-- برج الفيصلية: هرم بكرة زجاجية -->
      <path d="M48 706 136 170l88 536Z"/>
      <circle cx="136" cy="268" r="26"/>
      <!-- أبراج مساندة يسار -->
      <rect x="-8" y="432" width="60" height="274" rx="10"/>
      <rect x="356" y="352" width="74" height="354" rx="12"/>
      <rect x="444" y="462" width="50" height="244" rx="9"/>
      <!-- مئذنة -->
      <path d="M1216 706V416h32v290Z"/>
      <path d="M1232 340q26 36 26 58 0 26-26 26t-26-26q0-22 26-58Z"/>
      <rect x="1208" y="398" width="48" height="12" rx="6"/>
      <!-- أبراج يمين -->
      <rect x="1300" y="404" width="70" height="302" rx="11"/>
      <rect x="1386" y="316" width="58" height="390" rx="10"/>
      <rect x="1460" y="452" width="82" height="254" rx="12"/>
      <rect x="1556" y="392" width="52" height="314" rx="10"/>
    </g>

    <!-- ══ نخيل مجرّد ════════════════════════════════════════════════════ -->
    <g opacity="0.2" stroke="#0f9b93" fill="none" stroke-linecap="round">
      <g transform="translate(1108 706)">
        <path d="M0 0q-8-70-2-126" stroke-width="10"/>
        <path d="M-2-126q-40-30-84-24M-2-126q40-30 84-24M-2-126q-30-46-72-58M-2-126q30-46 72-58M-2-126q-10-46-38-72M-2-126q10-46 38-72"
              stroke-width="9"/>
      </g>
      <g transform="translate(1512 706) scale(0.8)">
        <path d="M0 0q-8-70-2-126" stroke-width="10"/>
        <path d="M-2-126q-40-30-84-24M-2-126q40-30 84-24M-2-126q-30-46-72-58M-2-126q30-46 72-58M-2-126q-10-46-38-72M-2-126q10-46 38-72"
              stroke-width="9"/>
      </g>
    </g>

    <!-- ══ ألواح زجاجية ══════════════════════════════════════════════════ -->
    <g>
      <rect x="112" y="212" width="880" height="520" rx="96" fill="url(#pkGlass)"
            stroke="url(#pkGlassEdge)" stroke-width="2"/>
      <rect x="1122" y="286" width="300" height="300" rx="72" fill="#ffffff" opacity="0.26"/>
    </g>

    <!-- ══ ظل أرضي ═══════════════════════════════════════════════════════ -->
    <ellipse cx="400" cy="716" rx="330" ry="66" fill="url(#pkGround)"/>
    <ellipse cx="820" cy="618" rx="170" ry="40" fill="url(#pkGround)"/>

    <!-- ══ المحفظة الرقمية ═══════════════════════════════════════════════ -->
    <g transform="translate(150 392) rotate(-3 250 150)">
      <!-- اللوح الخلفي -->
      <g filter="url(#pkSoft)">
        <rect x="0" y="0" width="500" height="304" rx="48" fill="url(#pkWalletBack)"/>
      </g>

      <!-- البطاقات تخرج من داخل المحفظة -->
      <g filter="url(#pkCardShadow)">
        <g transform="rotate(-29 250 270)">
          <rect x="104" y="-128" width="300" height="216" rx="26" fill="url(#pkCardCyan)"/>
          <rect x="104" y="-128" width="300" height="216" rx="26" fill="url(#pkSheen)"/>
          <g fill="#ffffff">
            <rect x="134" y="-98" width="50" height="36" rx="9" opacity="0.72"/>
            <rect x="134" y="-42" width="136" height="11" rx="5.5" opacity="0.5"/>
            <rect x="134" y="-18" width="88" height="11" rx="5.5" opacity="0.32"/>
          </g>
        </g>
        <g transform="rotate(-3 250 270)">
          <rect x="104" y="-152" width="300" height="216" rx="26" fill="url(#pkCardWhite)"/>
          <rect x="104" y="-152" width="300" height="216" rx="26" fill="none" stroke="#ffffff" stroke-width="2"/>
          <rect x="134" y="-122" width="56" height="20" rx="10" fill="#c3e2ff"/>
          <path d="M136-58h42l18-36 27 70 20-42 16 18h60" fill="none" stroke="#2470e2"
                stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
          <rect x="134" y="-14" width="124" height="12" rx="6" fill="#d3e6fa"/>
        </g>
        <g transform="rotate(14 250 270)">
          <rect x="104" y="-130" width="300" height="216" rx="26" fill="url(#pkCardBlue)"/>
          <rect x="104" y="-130" width="300" height="216" rx="26" fill="url(#pkSheen)"/>
          <rect x="134" y="-100" width="56" height="42" rx="10" fill="#a9d8ff" opacity="0.92"/>
          <path d="M134-79h56M162-100v42" stroke="#1f4fc4" stroke-width="4" opacity="0.65"/>
          <g fill="#ffffff">
            <rect x="322" y="-104" width="15" height="50" rx="7.5" opacity="0.9"/>
            <rect x="304" y="-86" width="51" height="15" rx="7.5" opacity="0.9"/>
            <rect x="134" y="-32" width="152" height="12" rx="6" opacity="0.42"/>
            <rect x="134" y="-6" width="98" height="12" rx="6" opacity="0.26"/>
          </g>
        </g>
      </g>

      <!-- الجيب الأمامي: حافّته العليا تنحني للأسفل فتقرأ كفتحة -->
      <g filter="url(#pkSoftSm)">
        <path d="M0 44Q250 116 500 44V256Q500 304 452 304H48Q0 304 0 256Z" fill="url(#pkWalletFront)"/>
        <path d="M0 44Q250 116 500 44V256Q500 304 452 304H48Q0 304 0 256Z" fill="url(#pkPocketSheen)"/>
        <!-- حافّة مضيئة على الفتحة -->
        <path d="M2 45Q250 117 498 45" fill="none" stroke="url(#pkLip)" stroke-width="6"/>
        <!-- ضوء ناعم أسفل الحافّة -->
        <path d="M12 62Q250 132 488 62" fill="none" stroke="#ffffff" stroke-width="16" opacity="0.06"/>
        <!-- مشبك -->
        <rect x="194" y="206" width="112" height="42" rx="21" fill="url(#pkClasp)"/>
        <rect x="208" y="217" width="84" height="12" rx="6" fill="#ffffff" opacity="0.42"/>
      </g>
    </g>

    <!-- ══ الدرع الصحي ═══════════════════════════════════════════════════ -->
    <g transform="translate(700 318)">
      <rect x="-32" y="-28" width="292" height="322" rx="66" fill="#ffffff" opacity="0.3"/>
      <g filter="url(#pkSoft)">
        <path d="M114 6 226 50v106c0 72-54 116-112 134C48 272-6 228-6 156V50Z" fill="url(#pkShield)"/>
        <path d="M114 6 226 50v106c0 72-54 116-112 134Z" fill="#0a2c78" opacity="0.15"/>
        <path d="M114 6 226 50v44C180 68 48 68-6 94V50Z" fill="#ffffff" opacity="0.2"/>
        <path d="M62 154 98 192 168 110" fill="none" stroke="#ffffff" stroke-width="23"
              stroke-linecap="round" stroke-linejoin="round"/>
      </g>
    </g>

    <!-- ══ عملات الرصيد ══════════════════════════════════════════════════ -->
    <g filter="url(#pkSoftSm)">
      <g transform="translate(778 226)">
        <ellipse cx="0" cy="17" rx="62" ry="62" fill="url(#pkCoinEdge)"/>
        <circle cx="0" cy="0" r="62" fill="url(#pkCoinFace)"/>
        <circle cx="0" cy="0" r="48" fill="none" stroke="#ffffff" stroke-width="4" opacity="0.5"/>
        <g fill="#ffffff">
          <rect x="-9" y="-29" width="18" height="58" rx="9"/>
          <rect x="-29" y="-9" width="58" height="18" rx="9"/>
        </g>
        <path d="M-38-32a50 50 0 0 1 42-23" fill="none" stroke="#ffffff" stroke-width="7"
              stroke-linecap="round" opacity="0.65"/>
      </g>
      <g transform="translate(1002 476)">
        <ellipse cx="0" cy="12" rx="44" ry="44" fill="url(#pkCoinEdge)"/>
        <circle cx="0" cy="0" r="44" fill="url(#pkCoinFace)"/>
        <circle cx="0" cy="0" r="33" fill="none" stroke="#ffffff" stroke-width="3" opacity="0.45"/>
        <path d="M-19 2h10l5-12 8 24 6-14 4 6h11" fill="none" stroke="#ffffff" stroke-width="6"
              stroke-linecap="round" stroke-linejoin="round"/>
      </g>
      <g transform="translate(968 254)">
        <ellipse cx="0" cy="9" rx="30" ry="30" fill="url(#pkCoinEdge)"/>
        <circle cx="0" cy="0" r="30" fill="url(#pkCoinFace)"/>
        <g fill="#ffffff" opacity="0.92">
          <rect x="-5" y="-14" width="10" height="28" rx="5"/>
          <rect x="-14" y="-5" width="28" height="10" rx="5"/>
        </g>
      </g>
      <g transform="translate(1272 396) scale(0.7)" opacity="0.4">
        <ellipse cx="0" cy="12" rx="44" ry="44" fill="url(#pkCoinEdge)"/>
        <circle cx="0" cy="0" r="44" fill="url(#pkCoinFace)"/>
        <g fill="#ffffff" opacity="0.85">
          <rect x="-6" y="-20" width="12" height="40" rx="6"/>
          <rect x="-20" y="-6" width="40" height="12" rx="6"/>
        </g>
      </g>
    </g>

    <!-- ══ قلب صحي ═══════════════════════════════════════════════════════ -->
    <g transform="translate(624 596)" filter="url(#pkSoftSm)">
      <path d="M56 100C56 100 2 66 2 32 2 12 17-2 36-2c10 0 17 6 20 11 3-5 10-11 20-11 19 0 34 14 34 34 0 34-54 68-54 68Z"
            fill="url(#pkHeart)"/>
      <path d="M24 18c-7 4-11 11-11 20" fill="none" stroke="#ffffff" stroke-width="8"
            stroke-linecap="round" opacity="0.5"/>
    </g>

    <!-- ══ جزيئات ناعمة ══════════════════════════════════════════════════ -->
    <g fill="#ffffff">
      <circle cx="252" cy="252" r="9" opacity="0.85"/>
      <circle cx="1044" cy="200" r="7" opacity="0.65"/>
      <circle cx="1188" cy="576" r="11" opacity="0.55"/>
      <circle cx="132" cy="560" r="8" opacity="0.5"/>
      <circle cx="1462" cy="262" r="9" opacity="0.45"/>
      <circle cx="1400" cy="632" r="7" opacity="0.4"/>
      <circle cx="618" cy="188" r="6" opacity="0.6"/>
    </g>
    <g fill="none" stroke="#8fd6f5" opacity="0.38">
      <circle cx="1244" cy="198" r="26" stroke-width="3"/>
      <circle cx="1490" cy="516" r="34" stroke-width="3"/>
      <circle cx="106" cy="336" r="18" stroke-width="3"/>
    </g>

    <!-- ══ موجات انسيابية ════════════════════════════════════════════════ -->
    <g>
      <path d="M-40 748q300-104 620-38t1060-62v252H-40Z" fill="url(#pkWaveA)" opacity="0.5"/>
      <path d="M-40 802q340-92 700-22t980-82v202H-40Z" fill="url(#pkWaveC)" opacity="0.75"/>
      <path d="M-40 832q360-86 740-14t940-70v152H-40Z" fill="url(#pkWaveB)"/>
      <path d="M-40 228q220 96 470 40t560-96 650 12" fill="none" stroke="#ffffff" stroke-width="3" opacity="0.5"/>
      <path d="M-40 168q240 110 500 46t600-104 580 30" fill="none" stroke="#ffffff" stroke-width="2" opacity="0.3"/>
    </g>
  </g>
</svg>
