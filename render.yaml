# Render Blueprint — deploys the backend API (seha-app-server-main).
# The frontend (seha.sa-main) is hosted separately on Vercel.
# Database: Neon (Serverless PostgreSQL).
#
# Usage: Render Dashboard → New + → Blueprint → pick this repo → Apply.
# Then fill the secrets marked `sync: false` in the dashboard:
#   DATABASE_URL (from Neon → Connect) and FRONTEND_URL.
services:
  - type: web
    name: seha-app-server
    runtime: node
    rootDir: seha-app-server-main
    plan: free
    region: frankfurt            # pick the region closest to your users/DB
    buildCommand: npm install --omit=dev
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "20"
      # Auth (secret auto-generated by Render)
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 3h
      # Frontend origin — used for the verification QR code printed on the PDF.
      # SERVER_HOST is not needed: Render provides RENDER_EXTERNAL_URL automatically.
      # Set this in the dashboard to your NEW Vercel frontend URL after deploying it.
      - key: FRONTEND_URL
        sync: false
      # Database (Neon — Serverless PostgreSQL).
      # Paste the full pooled connection string from Neon → Connect
      # (host contains "-pooler"), e.g.
      #   postgresql://user:pass@ep-xxx-pooler.<region>.aws.neon.tech/neondb?sslmode=require
      - key: DATABASE_URL
        sync: false
