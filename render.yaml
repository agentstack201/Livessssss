# Render Blueprint — deploys the backend API (seha-app-server-main).
# The frontend (seha.sa-main) is hosted separately on Vercel.
# Database: Neon (Serverless PostgreSQL).
#
# Usage: Render Dashboard → New + → Blueprint → pick this repo → Apply.
# Then fill the secrets marked `sync: false` in the dashboard:
#   DATABASE_URL (from Neon → Connect) and FRONTEND_URL.
services:
  - type: web
    name: seha-app-server
    runtime: node
    rootDir: seha-app-server-main
    plan: free
    # Deliberately NOT an EEA region. Google offers no Gemini free-tier quota to
    # requests originating in the EEA, the UK or Switzerland, and frankfurt sits
    # inside that area — an unbilled key then fails with 400 FAILED_PRECONDITION
    # from the deployed backend while working fine from a developer machine in
    # Saudi Arabia (which is itself a fully supported country). Google evaluates
    # this against the SERVER's egress IP, not the end user's location.
    # frankfurt is only safe once billing is enabled on the key's Google Cloud
    # project. Render cannot change the region of an existing service, so this
    # takes effect on a newly created one.
    region: virginia
    buildCommand: npm install --omit=dev
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "20"
      # Auth (secret auto-generated by Render)
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 3h
      # Frontend origin — used for the verification QR code printed on the PDF.
      # SERVER_HOST is not needed: Render provides RENDER_EXTERNAL_URL automatically.
      # Set this in the dashboard to your NEW Vercel frontend URL after deploying it.
      - key: FRONTEND_URL
        sync: false
      # Database (Neon — Serverless PostgreSQL).
      # Paste the full pooled connection string from Neon → Connect
      # (host contains "-pooler"), e.g.
      #   postgresql://user:pass@ep-xxx-pooler.<region>.aws.neon.tech/neondb?sslmode=require
      - key: DATABASE_URL
        sync: false
      # ── إرسال التقارير عبر واتساب (اختياري، مغلق افتراضياً) ──────────────
      # بدون ضبط WHATSAPP_SENDER_ENABLED=true في لوحة Render، يبلّغ الخادم
      # الواجهةَ بأن الخدمة مغلقة فيختفي تبويب الربط بكامله — بما فيه حقل
      # إدخال الرقم وزر «بدء الربط».
      # كلاهما `sync: false` عمداً: تُضبط من اللوحة ولا يفرض هذا الملف قيمة
      # عليها، وإلا أعاد كل نشر ضبطها ومنع تفعيلها.
      # ⚠️ Baileys بروتوكول غير رسمي ومخالف لشروط واتساب — استخدم رقماً مخصّصاً.
      - key: WHATSAPP_SENDER_ENABLED
        sync: false
      - key: WHATSAPP_SELF_NUMBER
        sync: false
