# Render Blueprint — deploys the backend API (seha-app-server-main).
# The frontend (seha.sa-main) is hosted separately on Vercel.
#
# Usage: Render Dashboard → New + → Blueprint → pick this repo → Apply.
# Then fill ONLY the 3 database secrets (marked `sync: false`) in the dashboard.
services:
  - type: web
    name: seha-app-server
    runtime: node
    rootDir: seha-app-server-main
    plan: free
    region: frankfurt            # pick the region closest to your users/DB
    buildCommand: npm install --omit=dev
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "20"
      # Auth (secret auto-generated by Render)
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 3h
      # Frontend origin — used for the verification QR code printed on the PDF.
      # SERVER_HOST is not needed: Render provides RENDER_EXTERNAL_URL automatically.
      - key: FRONTEND_URL
        value: https://seha-sa-slenguiry.vercel.app
      # Database (Supabase PostgreSQL) — fixed values:
      - key: DB_NAME
        value: postgres
      - key: DB_PORT
        value: "5432"
      - key: DB_DIALECT
        value: postgres
      # Database secrets — set these 3 in the dashboard (from Supabase → Connect):
      - key: DB_HOST
        sync: false
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
